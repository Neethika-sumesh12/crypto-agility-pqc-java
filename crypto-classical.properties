# crypto-classical.properties
# The "before" picture: what most Java applications use today.
# Signing and key exchange here are quantum-vulnerable (Shor's algorithm).
# Runs on JDK 21+ with CryptoAgilityDemo.

# Step 1 - SIGN
signature.algorithm=SHA256withRSA
key.algorithm=RSA
key.size=2048

# Step 2 - KEY EXCHANGE (KEM API, JDK 21+)
kem.name=DHKEM
kem.key.algorithm=X25519

# Step 3 - ENCRYPT (AES-256 is fine against quantum; AES-128 is not)
symmetric.key.bits=256
