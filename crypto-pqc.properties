# crypto-pqc.properties
# The "after" picture: post-quantum algorithms (NIST FIPS 203 and 204).
# Requires JDK 24+ (JEP 496 ML-KEM, JEP 497 ML-DSA) with CryptoAgilityDemo.
# On JDK 17/21 use CryptoAgilityDemoBC (BouncyCastle) instead.
#
# Compare with crypto-classical.properties: only the algorithm names differ.

# Step 1 - SIGN
signature.algorithm=ML-DSA-65
key.algorithm=ML-DSA-65
key.size=0

# Step 2 - KEY EXCHANGE
# Parameter sets: ML-KEM-512 | ML-KEM-768 | ML-KEM-1024
kem.name=ML-KEM-768
kem.key.algorithm=ML-KEM-768

# Step 3 - ENCRYPT (unchanged: AES-256 needs no replacement)
symmetric.key.bits=256
